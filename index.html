<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="icon-512.png">

<title>Feedback Generator</title>
<style>
:root{--bg:#eef1ec;--card:#fbfcfa;--ink:#1c2b26;--mute:#5d6e67;--line:#cfd8d1;--acc:#1f6f54;--acc-ink:#fff;--out:#e3e9e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a16;--card:#18241f;--ink:#e6efe9;--mute:#9db0a6;--line:#2c3d36;--acc:#5fcf9f;--acc-ink:#07140f;--out:#0f1814}}
:root[data-theme="dark"]{--bg:#111a16;--card:#18241f;--ink:#e6efe9;--mute:#9db0a6;--line:#2c3d36;--acc:#5fcf9f;--acc-ink:#07140f;--out:#0f1814}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 18px}
label{display:block;font-weight:700;font-size:.9rem;margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
#name{font-size:1.25rem;padding:16px 14px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:inherit;font-weight:700;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#out{margin-top:22px;background:var(--out);border-radius:12px;padding:18px;min-height:130px;font:400 1.08rem/1.65 Georgia,serif;white-space:pre-wrap}
#out.empty{color:var(--mute);font-style:italic}
#copy{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:1.1rem;padding:16px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
#copy:disabled{opacity:.45;cursor:not-allowed}
#copy.done{transform:scale(.98)}
#status{min-height:1.4em;text-align:center;margin:8px 0 0;font-weight:700;color:var(--acc)}
.alt{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;color:var(--mute);font-size:.9rem}
.alt button{font:inherit;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
details{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:700}
textarea{height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;margin-top:10px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.hint{margin:6px 2px 0;color:var(--mute);font-size:.88rem}
small{color:var(--mute)}
@media (prefers-reduced-motion:no-preference){#copy{transition:transform .12s}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:16px 0 0}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none}
optgroup{font-style:normal}
#mat{margin:6px 2px 0;color:var(--mute);font-size:.88rem}
#out .m{}
</style>
</head>
<body>
<main>
<h1>Feedback Generator</h1>

<label for="name">Nama student</label>
<input id="name" type="text" autocomplete="off" placeholder="Ketik nama…">

<div class="two">
<div><label for="crit">Criteria</label><select id="crit"></select></div>
<div><label for="course">Course</label><select id="course"></select></div>
</div>

<label for="lesson">Lesson</label>
<select id="lesson"></select>

<label id="jl">Jenis feedback</label>
<div class="seg" id="jenis" role="group" aria-labelledby="jl"></div>

<label for="type">Tipe murid</label>
<select id="type"></select>
<p id="hint" class="hint"></p>

<label class="chk"><input type="checkbox" id="incl" checked> Sertakan teks materi lesson</label>

<div id="out" class="empty" aria-live="polite">Pilih course, lesson, dan tipe murid.</div>
<div class="alt" id="alt" hidden><span id="count"></span><button id="next" type="button">Variasi lain</button></div>
<button id="copy" type="button" disabled>Copy to Clipboard</button>
<p id="status" role="status"></p>
</main>

a} mengenal Hooks pada React Native. {nama} juga mempelajari  Penggunaan useState dan useEffect, mempelajari setTimeout, dan membuat Project Guess the Country Screen."},{"n":7,"t":"Stack Navigation and Another Way of using useEffect","x":"Pada pertemuan ini, {nama} mempelajari Stack Navigation. {nama} juga mempelajari Cara Lain Penggunaan useEffect Hook, dan mengenal Properti flexGrow."},{"n":8,"t":"Review and Middle Test","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."},{"n":9,"t":"FlatList and StyleSheet","x":"Pada pertemuan ini, {nama} mengenal FlatList pada React Native. {nama} juga mempelajari StyleSheet pada React Native, dan membuat Home Screen Movie Collection Project."},{"n":10,"t":"Learn More About FlatList and Sort The Data","x":"Dalam sesi ini, {nama} mempelajari Tentang Horizontal FlatList. {nama} juga menambahkan Component Lain sebelum dan setelah FlatList, dan mengurutkan Data Array of Objects."},{"n":11,"t":"Ternary Operator and  Combine StyleSheet with Inline Style","x":"Pada pertemuan ini, {nama} mempelajari Mengenai Ternary Operator. {nama} juga menggabungkan StyleSheet dan Inline Style, dan melanjutkan Home Screen Movie Collection Project."},{"n":12,"t":"Passing Data Between Screens","x":"Di pertemuan kali ini, {nama} mempelajari Cara Mengirim Data ke Screen lainnya. {nama} juga mempelajari Cara Menerima Data yang Telah Dikirim, dan membuat Detail Movie Screen."},{"n":13,"t":"Empty FlatList and Column in FlatList","x":"Pada sesi kali ini, {nama} menampilkan 3 Data Teratas. {nama} juga menampilkan Pesan saat Tidak Ada Data pada FlatList, mempelajari Cara Menambah Kolom pada FlatList, dan membuat Most Viewed Movie Screen."},{"n":14,"t":"Change The Header in Stack Navigation","x":"Pada pertemuan ini, {nama} mempelajari Cara Mengubah Header. Tak hanya itu, {nama} juga membuat Recommended Movie Screen."},{"n":15,"t":"Android Apps Development 1 Exam Part 1","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."},{"n":16,"t":"Android Apps Development 1 Exam Part 2","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."}]},{"crit":"Teens","name":"Python for AI","lessons":[{"n":1,"t":"Introduction to AI and Machine Learning","x":"Dalam pertemuan kali ini, {nama} mempelajari konsep Artificial Intelligence. {nama} juga mempelajari penerapan AI di kehidupan sehari-hari, mempelajari cakupan AI, dan mempelajari cara kerja Machine Learning."},{"n":2,"t":"OOP (Object Oriented Programming)","x":"Pada pertemuan ini, {nama} memahami konsep OOP. {nama} juga membedakan Object, Class, Method, dan Property, mempelajari konsep inheritence di OOP, dan membuat game sederhana menggunakan OOP."},{"n":3,"t":"Tic Tac Toe With Numpy","x":"Di sesi ini, {nama} menggunakan Numpy Library. {nama} juga membuat Numpy Array (1D, 2D, 3D) dan memanipulasinya, mempelajari Operasi Dasar pengolahan Numpy Array, dan membuat project TicTacToe menggunakan Numpy."},{"n":4,"t":"OpenCV Image Manipulation","x":"Pada pertemuan ini, {nama} mempelajari konsep Computer Vision. {nama} juga menggunakan OpenCV Library, mempelajari konsep Image Processing, mempelajari teknik blurring menggunakan OpenCV, dan mempelajari Image Manipulation menggunakan OpenCV."},{"n":5,"t":"OpenCV Color Processing and Cartoonizer Image","x":"Pada pertemuan ini, {nama} mempelajari image processing gray scale image di OpenCV. {nama} juga mempelajari konsep Canny Edge Detector dan Countour Detection, mempelajari cara mengidentifikasi warna di OpenCV, dan membuat project Image Cartoonize."},{"n":6,"t":"Face Detection","x":"Dalam sesi ini, {nama} menggunakan Pre-trained model dan Machine Learning Framework. {nama} juga membuat aplikasi face detection di gambar, dan membuat aplikasi face detection di video."},{"n":7,"t":"MobileNetSSD Object Detection","x":"Pada pertemuan ini, {nama} mempelajari arsitektur model Single Shot Detector (SSD). {nama} juga dapat membuat project Object Detection menggunakan Model SSD, dan mengimplementasikan project object Detector baik itu di gambar atau di video."},{"n":8,"t":"Summary and Exam","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."},{"n":9,"t":"Object Detection VS Object Tracking","x":"Di pertemuan kali ini, {nama} mempelajari konsep Object Tracking dan cara kerjanya. {nama} juga mempelajari perbedaan Object Detection dan Tracking, mempelajari konsep Euclidean Distance Tracker, mempelajari konsep countour detection, dan mempelajari konsep image thresholding."},{"n":10,"t":"Euclidean Distance Tracker Class","x":"Pada sesi kali ini, {nama} mengaplikasikan penggunaan Euclidean Distance Tracker Class. {nama} juga menambahkan Unique Identification dari object yang terdeteksi untuk proses tracking, dan menambahkan \"marker\" untuk object yang sedang di track."},{"n":11,"t":"Hand Landmarks Detection","x":"Pada pertemuan ini, {nama} diperkenalkan dengan Mediapipe Library untuk landmark detection. {nama} juga menggunakana Mediapipe untuk Holistic Tracking, mendalami konsep Image Manipulation di Video Frames, dan membuat project Virtual Painter."},{"n":12,"t":"Find Landmark Position","x":"Dalam pertemuan kali ini, {nama} mencari posisi landmark tangan menggunakan method enumerate(). {nama} juga mempelajari klasifikasi landmark pada tangan, menginisialisasi mode pada project Virtual Painter (Selection dan Drawing), dan finishing project dengan teknis Video Frame Masking."},{"n":13,"t":"Mediapipe Face Mesh","x":"Pada pertemuan ini, {nama} mempelajari anatomi Face Mesh di Mediapipe. {nama} juga menggambar landmark menggunakan Face Mesh Landmark model, dan membuat project Pig Face Filter menggunakan Mediapipe."},{"n":14,"t":"Mediapipe Facial Area","x":"Di sesi ini, {nama} mempelajari implementasi dari Face Mesh Landmark. {nama} juga mempelajari Facial Area yang ada di dalam Mediapipe, membuat project Face FIlter Dragon Project, dan membuat class Face Mesh untuk mendeteksi Facial Area."},{"n":15,"t":"Detect Mouth and Eye","x":"Pada pertemuan ini, {nama} mengidentifikasi apakah mulut terbuka atau tidak. {nama} juga mengidentifikasi nomor landmark pada facial mesh, dan melakukan Video masking untuk menempelkan efek filter ke dalam frames."},{"n":16,"t":"Final Exam","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."}]},{"crit":"Teens","name":"Python Game Developer","lessons":[{"n":1,"t":"Introduction to Pygame","x":"Di pertemuan kali ini, {nama} mempelajari bagaimana mendevelop game menggunakan Pygame. {nama} juga mempelajari bagaimana cara setting environtment di Pygame, mempelajari bagaimana konsep event controller bekerja, dan mempelajari bagaimana cara menambahkan object di dalam Pygame."},{"n":2,"t":"Add Another Sprite for Snake Game","x":"Pada sesi kali ini, {nama} mempelajari bagaimana cara inisialisasi FPS di dalam Pygame. {nama} juga menambahkan object lain ke dalam Pygame canvas, mempelajari bagaimana cara berpindah layout dalam Pygame, mempelajari apa fungsi FPS dalam Game Development, mempelajari list operational dalam Python, dan mempelajari cara menambahkan text ke dalam layout Pygame."},{"n":3,"t":"Load Image Sprite in Astro Man","x":"Pada pertemuan ini, {nama} mempelajari functional programming style (modular dan reusable). {nama} juga membuat screen menggunakan function, mempelajari management folder di dalam Pygame, mempelajari bagaimana cara load assets di Pygame, mempelajari bagaimana cara render gambar di Pygame, dan mempelajari cara load dan play sound effect."},{"n":4,"t":"Spawn The Pipe","x":"Dalam pertemuan kali ini, {nama} mempelajari Gravity Concept dalam game. {nama} juga mempelajari perbedaan Velocity dan Acceleration, dapat menggerakan object secara static, dan menghapus object dari Window."},{"n":5,"t":"Create Collide Event","x":"Pada pertemuan ini, {nama} mempelajari bagaimana cara kerja collide sprite lebih complex. {nama} juga mempelajari kondisi collide dalam game dan dikemas dalam sebuah function, mempelajari bagaimana cara akses global variabel, dan mempelajari bagaimana cara setting high score di dalam Game."},{"n":6,"t":"Multiplayer Space Shooter","x":"Di sesi ini, {nama} mengenal konsep multiplayer game. {nama} juga mengenal macam-macam fungsi tranform pada Pygame, dan memperdalam terkait function scale dan rotate dalam pygame."},{"n":7,"t":"Spawn the Bullet and Make the Ship Move","x":"Pada pertemuan ini, {nama} memperdalam mendalami Behavior pygame.Rect() !. {nama} juga mendalami konsep velocity untuk membuat object bergerak, memahami konsep method pygame.key.get_pressed(), dan membuat kode menjadi lebih modular dengan memecar program menjadi beberapa function."},{"n":8,"t":"Finishing the Space Shooter !","x":"Pada pertemuan ini, {nama} memahami cara membuat custom event or user event di dalam Pygame. {nama} juga memahami bagaimana menerima broadcast user event atau custom event di dalam Pygame, memahami cara membuat winning screen game !, dan mempelajari cara Convert Pygame menjadi executable file."},{"n":9,"t":"Runner Game","x":"Dalam sesi ini, {nama} memahami konsep dan terminologi animation secara umum. {nama} juga memahami bagaimana membuat animation sprite di Pygame, menambahkan font external ke dalam Pygame, dan mempelajari function time() lebih lanjut."},{"n":10,"t":"Spawn The Enemy","x":"Pada pertemuan ini, {nama} mendalami lebih dalam terkait gravitasi dalam game. {nama} juga mengimplementasikan animation frame untuk sprite yang lebih banyak, memahami pengkondisian ketika melakukan spawing object atau enemy, dan menambahkan background sound ke dalam game."},{"n":11,"t":"Publish your game","x":"Di pertemuan kali ini, {nama} mengeksplorasi ide untuk project mandiri. {nama} juga mengumpulkan assets untuk project mandiri, membuat timeline development game, dan mempersiapkan folder environtment untuk project."},{"n":12,"t":"Create your own game","x":"Pada sesi kali ini, {nama} mengeksplorasi ide untuk project mandiri. {nama} juga mengumpulkan assets untuk project mandiri, membuat timeline development game, dan mempersiapkan folder environtment untuk project."},{"n":13,"t":"Create your own game (Explore)","x":"Pada pertemuan ini, {nama} melanjutkan progress development project. {nama} juga mendesain Screen untuk project mandiri, dan menambahkan sprite ke dalam game."},{"n":14,"t":"Create Your Own Game (Coding the Logic )","x":"Dalam pertemuan kali ini, {nama} melanjutkan progress development project. {nama} juga coding Logic untuk Game, membuat sprite bergerak, dan menambahkan enemies untuk game."},{"n":15,"t":"Create Your Own Game (Finishing and Build Your Project)","x":"Pada pertemuan ini, {nama} mendefinisikan Game Over Condition. {nama} juga melakukan presentasi dan Revisi project, dan finishing project."},{"n":16,"t":"CreateYour Own Game (Build and Publish your Game)","x":"Di sesi ini, {nama} melakukan build game menjadi executable file. Tak hanya itu, {nama} juga melakukan publish game tersebut."}]},{"crit":"Teens","name":"Python Coder","lessons":[{"n":1,"t":"Intro to Python","x":"Di pertemuan kali ini, {nama} mempelajari Python dan aturan penggunaannya bahasanya. {nama} juga mengenalkan extension untuk mempermudah coding Python, mempelajari cara menampilkan hasil output dengan perintah print, dan mempelajari penulisan operator matematika dalam Python."},{"n":2,"t":"Variable and List in Python","x":"Pada sesi kali ini, {nama} mempelajari konsep variable dan cara menggunakannya. {nama} juga mengenalkan perintah input untuk meminta respon dari user, mengenalkan jenis data types dalam python, mengenalkan konsep List dan cara menggunakannya, dan menggambar bentuk menggunakan Python Turtle."},{"n":3,"t":"Data Structure to Store Multiple Items","x":"Pada pertemuan ini, {nama} mempelajari konsep data struktur dan tipenya. {nama} juga mempelajari cara mengolah data pada List, Tuple, dan Dictionary, mengenalkan konsep List 2 Dimensi dan cara menggunakannya, dan mempelajari cara memilih data secara acak dengan Random Module."},{"n":4,"t":"Doing Loops in Python","x":"Dalam pertemuan kali ini, {nama} mempelajari Loops untuk pembuatan coding. {nama} juga mengenalkan jenis dan perbedaan Loops (For, While) serta cara menggunakannya, mengenalkan pentingnya memberikan indentasi dalam penulisan coding, dan mempelajari penggunaan loops untuk mempersingkat penulisan coding."},{"n":5,"t":"Conditional and Conditional Loops","x":"Pada pertemuan ini, {nama} mempelajari Konsep Conditional dan penggunaan if, elif, dan else untuk membuat kondisi. {nama} juga mengenalkan konsep dan penggunaan operator perbandingan dan logika dalam conditional, mengenalkan konsep case sensitive dengan lower sebagai solusinya, dan mengenalkan konsep conditional loops serta cara penggunaannya dengan While dan If."},{"n":6,"t":"Creating Function","x":"Di sesi ini, {nama} mempelajari konsep Function dan Jenis nya. {nama} juga mempelajari cara menggunakan built-in function, dan membuat manual function sendiri untuk fungsi tertentu."},{"n":7,"t":"One-Liner, Scope, and Function Parameters","x":"Pada pertemuan ini, {nama} mempelajari konsep penulisan coding one liner. {nama} juga mengenalkan konsep penulisan coding one liner, dan mengenalkan dan menggunakan function parameters dalam program."},{"n":8,"t":"Python Coder Middle Exam","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."},{"n":9,"t":"Object Oriented Programming (OOP)","x":"Pada pertemuan ini, {nama} diperkenalkan dengan konsep Object-Oriented Programming (OOP) - cara mengorganisir kode menggunakan Class dan Object agar lebih terstruktur dan mudah dikembangkan."},{"n":10,"t":"Intro to Python Module","x":"Dalam sesi ini, {nama} diperkenalkan dengan Artificial Intelligence (AI) dan langsung mencoba berbagai penerapannya dalam Python - melihat bagaimana komputer bisa belajar dari data."},{"n":11,"t":"Intro to Python TKinter","x":"Pada pertemuan ini, {nama} mempelajari dan menggunakan TKinter module. Selain itu, {nama} juga mengenalkan dan menggunakan komponen pada TKinter."},{"n":12,"t":"TKinter Message and Input Box  with Label and Button","x":"Di pertemuan kali ini, {nama} mempelajari Message Boxes, Input Boxes, Labels, dan Buttons. {nama} juga mempelajari cara menggunakan Message Boxes, Input Boxes, Labels, dan Buttons."},{"n":13,"t":"TKinter Canvas Coordinates","x":"Pada sesi kali ini, {nama} belajar menggunakan sistem koordinat pada Canvas di TKinter - memahami bagaimana menentukan posisi dan menggambar bentuk-bentuk geometri di layar."},{"n":14,"t":"TKinter Mouse Events","x":"Pada pertemuan ini, {nama} belajar konsep Events di TKinter - bagaimana program merespons interaksi pengguna seperti klik mouse, penekanan tombol keyboard, dan aksi lainnya."},{"n":15,"t":"Final Exam Python Coder Part 1","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."},{"n":16,"t":"Final Exam Python Coder Part 2","x":"{nama} melaksanakan sesi review dan ujian pada pertemuan ini sebagai evaluasi pemahaman materi yang telah dipelajari sebelumnya."}]}],"F":[{"k":"Umum","p":"Penuh Rasa Ingin Tahu","i":"Sering bertanya kenapa dan bagaimana kalau; ingin tahu cara kerja sesuatu, bukan hanya hasil akhirnya.","j":"Apresiasi","t":"[nama] sering bertanya kenapa sesuatu bekerja begitu, bukan hanya apa yang harus diketik. Rasa ingin tahu ini membuat pemahamannya pada materi lebih kuat."},{"k":"Umum","p":"Disiplin Waktu","i":"Hadir dan siap mulai tepat waktu tanpa perlu diingatkan; alat dan materi sudah siap saat sesi dibuka.","j":"Apresiasi","t":"[nama] selalu siap tepat waktu dan langsung mulai mengerjakan materinya. Disiplin ini membuat waktu belajar terpakai penuh dan progresnya stabil."},{"k":"Umum","p":"Mandiri","i":"Mencoba sendiri dulu sebelum minta bantuan pengajar; mencari jalan keluar dengan cara sendiri.","j":"Apresiasi","t":"[nama] mencoba menyelesaikan sendiri dulu sebelum meminta bantuan, dan caranya mencari jalan keluar makin rapi. Kemandirian ini bekal belajar yang awet."},{"k":"Umum","p":"Tekun","i":"Bertahan mengerjakan sampai selesai walau materinya sulit; tidak mudah berhenti di tengah jalan.","j":"Apresiasi","t":"Meski materinya cukup menantang, [nama] bertahan sampai tuntas tanpa mudah berhenti. Ketekunan seperti ini yang membuat kemajuannya terasa pasti."},{"k":"Umum","p":"Teliti","i":"Memeriksa ulang hasil sebelum dinyatakan selesai; kesalahan kecil sering tertangkap sendiri.","j":"Apresiasi","t":"[nama] memeriksa kembali hasil kerjanya sebelum menyatakan selesai, sehingga kesalahan kecil sering tertangkap sendiri. Kebiasaan ini sangat baik dijaga."},{"k":"Umum","p":"Berani Mencoba","i":"Tidak takut salah; langsung mencoba cara atau fitur baru walau belum yakin hasilnya.","j":"Apresiasi","t":"[nama] berani mencoba cara baru walau belum yakin hasilnya. Ia paham bahwa salah adalah bagian dari belajar, dan itu membuatnya cepat paham materi."},{"k":"Umum","p":"Tenang Menghadapi Kesalahan","i":"Tidak panik saat hasil meleset atau muncul error; menelusuri penyebab dengan kepala dingin.","j":"Apresiasi","t":"Saat hasilnya meleset, [nama] tidak panik dan mulai menelusuri penyebabnya pelan-pelan. Ketenangan ini sudah menjadi setengah dari solusinya."},{"k":"Umum","p":"Fokus Penuh","i":"Konsentrasi terjaga sepanjang sesi; tidak mudah teralih oleh suasana sekitar.","j":"Apresiasi","t":"Fokus [nama] sepanjang sesi terjaga baik, sehingga materi baru bisa masuk dengan cepat. Kemampuan ini penting dan layak terus dilatih."},{"k":"Umum","p":"Terbuka pada Masukan","i":"Menerima koreksi tanpa membela diri dan langsung memperbaikinya.","j":"Apresiasi","t":"[nama] menerima koreksi dengan lapang dan langsung memperbaikinya. Sikap terbuka seperti ini sangat mempercepat belajarnya."},{"k":"Umum","p":"Jujur Soal Kesulitan","i":"Berani mengaku belum paham atau sedang kesulitan, tidak berpura-pura mengerti.","j":"Apresiasi","t":"[nama] jujur menyampaikan bagian yang belum ia pahami, sehingga penjelasan bisa tepat sasaran. Keterbukaan seperti ini sangat kami hargai."},{"k":"Umum","p":"Bertanggung Jawab","i":"Mengerjakan latihan dan tugas tanpa perlu diingatkan; menganggap belajar sebagai urusannya sendiri.","j":"Apresiasi","t":"[nama] mengerjakan latihannya tanpa perlu diingatkan. Rasa tanggung jawab terhadap belajarnya sendiri sudah mulai tumbuh, dan itu modal besar."},{"k":"Umum","p":"Kreatif","i":"Punya ide dan cara sendiri dalam menyelesaikan latihan; hasilnya terasa khas.","j":"Apresiasi","t":"[nama] punya cara sendiri menyelesaikan latihan dan hasilnya terasa khas. Kreativitas ini kami dukung, sambil memastikan hasilnya tetap sesuai tujuan materi."},{"k":"Umum","p":"Antusias","i":"Terlihat bersemangat sejak awal sesi; menyambut materi baru dengan senang.","j":"Apresiasi","t":"Semangat [nama] belajar terlihat jelas sejak awal sesi. Antusiasme ini sangat membantu, terutama ketika materinya mulai terasa sulit."},{"k":"Umum","p":"Sabar dalam Proses","i":"Mengerjakan tahap demi tahap tanpa terburu-buru; mau menyelesaikan satu bagian sebelum pindah.","j":"Apresiasi","t":"[nama] mengerjakan materi tahap demi tahap tanpa terburu-buru. Kesabaran ini membuat pemahamannya lebih kokoh daripada sekadar cepat selesai."},{"k":"Umum","p":"Rapi dan Terorganisir","i":"File, folder, dan hasil kerja tertata; mudah menemukan pekerjaan sebelumnya.","j":"Apresiasi","t":"File dan hasil kerja [nama] tertata rapi sejak awal sesi, sehingga ia cepat menemukan apa yang dicari. Kerapian ini menghemat waktu belajarnya."},{"k":"Umum","p":"Konsisten","i":"Berlatih rutin dari pertemuan ke pertemuan; progresnya stabil, tidak naik turun.","j":"Apresiasi","t":"[nama] konsisten berlatih dari pertemuan ke pertemuan, dan progresnya terlihat stabil. Konsistensi seperti ini lebih berharga daripada semangat sesaat."},{"k":"Umum","p":"Pendengar yang Baik","i":"Menyimak penjelasan pengajar sampai selesai sebelum mulai bertindak.","j":"Apresiasi","t":"[nama] menyimak penjelasan sampai selesai sebelum bertindak, sehingga jarang perlu mengulang pertanyaan yang sama. Cara menyimaknya sangat membantu belajar."},{"k":"Umum","p":"Cepat Menangkap Materi","i":"Cepat paham materi baru, kadang sebelum penjelasan selesai; sering minta tantangan lebih.","j":"Apresiasi","t":"[nama] cepat menangkap materi baru, bahkan sebelum penjelasan selesai. Kami tetap mengajaknya menguji pemahaman lewat latihan agar benar-benar kuat."},{"k":"Umum","p":"Punya Target Sendiri","i":"Menyebutkan atau mengejar tujuan belajar yang ia tetapkan sendiri.","j":"Apresiasi","t":"[nama] punya target belajar yang jelas dan bekerja menuju ke sana. Anak yang tahu tujuannya biasanya lebih mudah menjaga semangat dan arah belajarnya."},{"k":"Umum","p":"Percaya Diri","i":"Yakin menyampaikan jawaban dan pendapat; tidak ragu menunjukkan hasil kerjanya.","j":"Apresiasi","t":"[nama] menjawab dengan yakin dan tidak ragu menyampaikan pendapatnya. Kami jaga percaya dirinya sambil tetap membiasakan terbuka pada koreksi."},{"k":"Umum","p":"Sopan dan Menghargai","i":"Santun kepada pengajar dan menghargai waktu belajar.","j":"Apresiasi","t":"Sikap [nama] sopan dan menghargai waktu belajar. Suasana sesi jadi nyaman, dan itu membantu proses belajarnya berjalan lancar."},{"k":"Umum","p":"Pandai Mengatur Tenaga","i":"Tahu kapan perlu jeda singkat dan kapan harus lanjut; staminanya terjaga sampai akhir sesi.","j":"Apresiasi","t":"[nama] tahu kapan perlu jeda sebentar dan kapan melanjutkan, sehingga stamina belajarnya terjaga sampai akhir sesi. Pengaturan diri yang cerdas."},{"k":"Umum","p":"Mau Mengulang","i":"Rela mengulang latihan sampai benar tanpa mengeluh.","j":"Apresiasi","t":"[nama] tidak keberatan mengulang latihan sampai benar. Sikap ini membuat hasil akhirnya lebih bersih daripada percobaan pertama."},{"k":"Umum","p":"Menghargai Proses","i":"Lebih peduli paham daripada sekadar selesai; bertanya alasan di balik langkah.","j":"Apresiasi","t":"[nama] lebih peduli paham daripada sekadar selesai. Itu cara belajar yang membuat ilmunya bertahan lama, dan kami dorong terus."},{"k":"Umum","p":"Menyambung Materi Lama","i":"Mengaitkan materi baru dengan yang sudah dipelajari sebelumnya.","j":"Apresiasi","t":"[nama] mengaitkan materi hari ini dengan yang sudah dipelajari sebelumnya. Kebiasaan menyambung ilmu ini membuat pemahamannya berlapis."},{"k":"Umum","p":"Gigih Mencari Jawaban","i":"Mencoba beberapa cara mencari jawaban sendiri sebelum bertanya.","j":"Apresiasi","t":"[nama] mencoba beberapa cara mencari jawaban sebelum bertanya, dan itu melatih daya juangnya. Ia tetap bertanya ketika benar-benar buntu."},{"k":"Umum","p":"Humoris dan Ringan","i":"Membawa suasana belajar santai dan menyenangkan, tetapi pekerjaan tetap berjalan.","j":"Apresiasi","t":"[nama] membawa suasana belajar yang santai dan ringan, tetapi pekerjaannya tetap berjalan. Keseimbangan seperti ini menyenangkan dan layak dipertahankan."},{"k":"Umum","p":"Berpikir Kritis","i":"Menguji dan mempertanyakan jawaban sebelum menerimanya begitu saja.","j":"Apresiasi","t":"[nama] tidak langsung menerima jawaban, tetapi mengujinya dulu. Cara berpikir kritis ini akan banyak membantunya di materi yang lebih lanjut."},{"k":"Umum","p":"Tidak Sibuk Membandingkan","i":"Fokus pada kemajuan sendiri; tidak terganggu oleh kecepatan anak lain.","j":"Apresiasi","t":"[nama] memperhatikan kemajuannya sendiri, bukan kecepatan anak lain. Cara pandang ini sehat dan membuatnya lebih tenang menjalani belajar."},{"k":"Umum","p":"Suka Mengeksplor","i":"Mencoba variasi atau fitur di luar yang diminta materi karena penasaran.","j":"Apresiasi","t":"[nama] suka mencoba variasi di luar yang diminta materi, dan itu menunjukkan rasa ingin tahunya. Kami arahkan agar eksplorasinya tetap mendukung tujuan lesson."},{"k":"Umum","p":"Mudah Terdistraksi","i":"Perhatian sering pindah dari materi ke hal lain (HP, suasana sekitar, ingin ngobrol).","j":"Perbaikan","t":"Perhatian [nama] masih beberapa kali pindah dari materi. Kami membantunya mengerjakan satu hal sampai selesai, dan dukungan di rumah akan sangat membantu."},{"k":"Umum","p":"Suka Menunda","i":"Baru mulai mengerjakan setelah waktu berjalan lama; butuh dorongan untuk memulai.","j":"Perbaikan","t":"[nama] cenderung baru mulai mengerjakan setelah beberapa waktu berlalu, sehingga hasilnya belum maksimal. Kami melatihnya memulai dari langkah paling kecil di menit pertama."},{"k":"Umum","p":"Takut Salah","i":"Ragu mencoba sebelum yakin benar; menunggu arahan dulu.","j":"Perbaikan","t":"[nama] sering menunggu yakin dulu sebelum mencoba, padahal salah adalah bagian dari belajar. Kami mendorongnya mencoba lebih dulu dan membahas hasilnya bersama."},{"k":"Umum","p":"Terlalu Perfeksionis","i":"Memoles satu bagian terlalu lama sampai materi berikutnya tertunda.","j":"Perbaikan","t":"[nama] terlalu lama memoles satu bagian sehingga materi berikutnya tertunda. Kami melatihnya menyelesaikan dulu, baru merapikan belakangan."},{"k":"Umum","p":"Cepat Puas","i":"Berhenti begitu hasil sudah jalan; jarang mencari cara yang lebih baik.","j":"Perbaikan","t":"Begitu hasilnya sudah jalan, [nama] cenderung langsung berhenti. Kami mengajaknya bertanya pada diri sendiri, apa lagi yang bisa dibuat lebih baik."},{"k":"Umum","p":"Cepat Menyerah","i":"Berhenti mencoba atau minta jawaban begitu tugas terasa sulit.","j":"Perbaikan","t":"Saat tugas terasa sulit, [nama] cepat berhenti mencoba. Kami melatihnya memecah masalah jadi bagian kecil dan menyelesaikannya satu per satu."},{"k":"Umum","p":"Tergesa-gesa","i":"Mengerjakan sangat cepat, tetapi detail kecil sering terlewat.","j":"Perbaikan","t":"[nama] mengerjakan dengan sangat cepat, tetapi detail kecil sering terlewat. Kami membiasakannya memeriksa ulang beberapa menit sebelum menyatakan selesai."},{"k":"Umum","p":"Kurang Percaya Diri","i":"Meremehkan kemampuan sendiri; sering bilang tidak bisa sebelum mencoba.","j":"Perbaikan","t":"Kemampuan [nama] sebenarnya lebih baik dari penilaiannya sendiri. Kami mendorongnya menjawab dulu sebelum menilai diri, dan hasilnya sering di luar dugaannya."},{"k":"Umum","p":"Pasif Bertanya","i":"Diam walau terlihat bingung; jarang menyampaikan bagian yang belum jelas.","j":"Perbaikan","t":"[nama] sering diam padahal terlihat bingung pada bagian tertentu. Kami terus meyakinkannya bahwa bertanya itu wajar dan membantu belajarnya."},{"k":"Umum","p":"Terlalu Bergantung","i":"Cepat meminta bantuan sebelum mencoba sendiri.","j":"Perbaikan","t":"[nama] masih cepat meminta bantuan sebelum mencoba sendiri. Kami membiasakannya menuliskan dulu apa yang sudah dicoba, baru menanyakan sisanya."},{"k":"Umum","p":"Mudah Bosan","i":"Cepat jenuh ketika materi berulang atau latihan terasa monoton.","j":"Perbaikan","t":"[nama] cepat jenuh ketika materinya berulang. Kami membantunya dengan target-target kecil yang berbeda di tiap latihan agar tetap menarik."},{"k":"Umum","p":"Butuh Validasi Terus","i":"Sering minta dicek pada setiap langkah kecil sebelum melanjutkan.","j":"Perbaikan","t":"[nama] cukup sering meminta dicek pada setiap langkah kecil. Kami melatihnya menilai hasil sendiri dulu agar makin percaya pada kemampuannya."},{"k":"Umum","p":"Kurang Teliti Membaca Instruksi","i":"Melewatkan bagian instruksi soal sehingga hasil tidak sesuai permintaan.","j":"Perbaikan","t":"Beberapa kesalahan [nama] berasal dari instruksi soal yang belum dibaca sampai habis. Kami membiasakannya membaca pelan satu kali penuh sebelum mengerjakan."},{"k":"Umum","p":"Sering Terlambat","i":"Datang atau mulai sesi tidak tepat waktu sehingga materi terpotong.","j":"Perbaikan","t":"[nama] beberapa kali terlambat sehingga sebagian materi terlewat. Mohon dukungan agar bersiap sedikit lebih awal supaya sesi bisa dimulai tepat waktu."},{"k":"Umum","p":"Enggan Mengulang","i":"Tidak mau memperbaiki bagian yang masih keliru; ingin langsung lanjut.","j":"Perbaikan","t":"[nama] cenderung enggan mengulang bagian yang masih keliru. Padahal percobaan kedua biasanya lebih cepat dan hasilnya lebih baik, itu yang kami tekankan."},{"k":"Umum","p":"Suka Membandingkan Diri","i":"Merasa kalah dari anak lain; mengukur diri dari kecepatan orang lain.","j":"Perbaikan","t":"[nama] sering mengukur diri dengan kecepatan anak lain. Kami mengingatkan bahwa tiap anak punya jalurnya, dan ia cukup membandingkan dengan dirinya sendiri."},{"k":"Umum","p":"Mudah Frustrasi","i":"Kesal atau emosi ketika hasil belum sesuai harapan.","j":"Perbaikan","t":"Saat hasilnya belum sesuai, [nama] mudah kesal. Kami melatihnya menarik napas, istirahat sebentar, lalu melihat masalahnya lagi dengan kepala lebih dingin."},{"k":"Umum","p":"Suka Bercerita di Sela Belajar","i":"Senang bercerita atau mengobrol sehingga waktu pengerjaan berkurang.","j":"Perbaikan","t":"[nama] senang bercerita, dan itu bagus untuk suasana. Hanya saja waktu pengerjaan jadi berkurang, jadi kami arahkan ceritanya ke jeda sesi."},{"k":"Umum","p":"Terlalu Pendiam","i":"Jarang menyampaikan isi pikiran sehingga sulit diketahui sejauh mana ia paham.","j":"Perbaikan","t":"[nama] jarang menyampaikan isi pikirannya, sehingga sulit mengetahui sejauh mana pemahamannya. Kami mengajaknya menceritakan singkat apa yang sedang dikerjakan."},{"k":"Umum","p":"Mengandalkan Hafalan","i":"Menghafal langkah tanpa paham alasannya; bingung ketika soal berubah.","j":"Perbaikan","t":"[nama] menghafal langkah-langkahnya, tetapi bingung saat soalnya berubah. Kami melatihnya memahami alasan di balik tiap langkah, bukan hanya mengikutinya."},{"k":"Umum","p":"Tidak Sabaran","i":"Ingin hasil cepat jadi; sulit menikmati tahapan.","j":"Perbaikan","t":"[nama] ingin hasilnya cepat jadi, padahal tahapnya perlu dilalui satu per satu. Kami mengajaknya menikmati prosesnya, karena hasil yang rapi biasanya datang belakangan."},{"k":"Umum","p":"Mengerjakan Asal Selesai","i":"Mengejar selesai, bukan paham; hasil jalan tetapi tidak bisa menjelaskan alasannya.","j":"Perbaikan","t":"[nama] sering mengerjakan hanya demi selesai. Kami mengajaknya bertanya pada diri sendiri apakah ia sudah paham, bukan hanya apakah sudah rampung."},{"k":"Umum","p":"Kurang Rutin Berlatih","i":"Latihan naik turun dari pertemuan ke pertemuan; materi lama cepat terlupa.","j":"Perbaikan","t":"Latihan [nama] masih naik turun dari pertemuan ke pertemuan. Jadwal kecil yang tetap, misalnya lima belas menit sehari di rumah, akan sangat membantu."},{"k":"Umum","p":"Terpengaruh Suasana Hati","i":"Kualitas kerja sangat bergantung pada mood hari itu.","j":"Perbaikan","t":"Hasil kerja [nama] sangat dipengaruhi suasana hatinya hari itu. Kami melatihnya tetap menyelesaikan target minimal walau sedang kurang bersemangat."},{"k":"Umum","p":"Terlalu Keras pada Diri Sendiri","i":"Mengkritik hasil sendiri berlebihan walau progresnya baik.","j":"Perbaikan","t":"[nama] terlalu keras menilai hasil kerjanya sendiri padahal kemajuannya nyata. Kami mengajaknya menyebut satu hal yang berhasil sebelum menyebut yang kurang."},{"k":"Umum","p":"Jarang Mengecek Hasil","i":"Menyatakan selesai tanpa mencoba atau menguji hasilnya.","j":"Perbaikan","t":"[nama] jarang menguji hasil sebelum menyatakan selesai. Kami membiasakannya mengecek sendiri sekali, sehingga kesalahan ketahuan sebelum dikumpulkan."},{"k":"Umum","p":"Kehadiran Belum Stabil","i":"Sering izin atau absen sehingga materi terputus.","j":"Perbaikan","t":"Kehadiran [nama] yang belum stabil membuat materinya terputus. Mohon kabari lebih awal bila berhalangan hadir agar materi bisa kami atur."},{"k":"Umum","p":"Melamun Saat Penjelasan","i":"Pikiran melayang ketika dijelaskan, lalu bingung saat mulai mengerjakan.","j":"Perbaikan","t":"Pikiran [nama] sering melayang saat penjelasan, lalu ia bingung ketika mulai mengerjakan. Kami melatihnya fokus lewat penjelasan yang lebih singkat dan bertahap."},{"k":"Umum","p":"Menghindari Bagian Sulit","i":"Mengerjakan bagian yang mudah dulu dan menunda yang sulit.","j":"Perbaikan","t":"[nama] cenderung mengerjakan bagian yang mudah dulu dan menunda yang sulit. Kami membiasakannya mengerjakan yang sulit di awal, saat tenaganya masih penuh."},{"k":"Umum","p":"Terlalu Cepat Merasa Paham","i":"Yakin sudah paham padahal ketika diuji ada bagian yang belum kuat.","j":"Perbaikan","t":"[nama] cepat merasa paham, tetapi saat diuji ada bagian yang belum kuat. Kami melatihnya menguji pemahaman dulu sebelum lanjut ke materi berikutnya."},{"k":"Umum","p":"Fokus Makin Tahan","i":"Dulu mudah teralih, kini bertahan fokus lebih lama dalam satu sesi.","j":"Perkembangan","t":"Dibanding awal, [nama] bertahan fokus jauh lebih lama dalam satu sesi. Perubahan ini terlihat jelas, dan kami terus menjaga ritmenya."},{"k":"Umum","p":"Mulai Berani Bertanya","i":"Dulu diam saat bingung, kini mulai bertanya.","j":"Perkembangan","t":"Hari ini [nama] bertanya tentang bagian yang belum jelas, padahal sebelumnya lebih sering diam. Itu langkah besar, dan kami terus mendorongnya."},{"k":"Umum","p":"Makin Tepat Waktu","i":"Dulu sering terlambat, kini datang dan mulai tepat waktu.","j":"Perkembangan","t":"[nama] belakangan datang dan mulai tepat waktu. Perubahan kecil yang dijaga rutin ini berdampak besar pada belajarnya, mohon terus didukung."},{"k":"Umum","p":"Makin Mandiri","i":"Dulu cepat minta bantuan, kini mencoba sendiri lebih dulu.","j":"Perkembangan","t":"Sekarang [nama] mencoba sendiri lebih dulu dan baru bertanya kalau benar-benar buntu. Dibanding awal, kemandiriannya tumbuh nyata."},{"k":"Umum","p":"Lebih Berani Mencoba","i":"Dulu takut salah, kini mau mencoba tanpa menunggu yakin.","j":"Perkembangan","t":"[nama] mulai berani mencoba tanpa menunggu yakin lebih dulu. Itu perubahan sikap yang baik, karena belajar memang butuh percobaan."},{"k":"Umum","p":"Lebih Tenang Saat Salah","i":"Dulu panik atau kesal saat salah, kini tenang dan mencari penyebabnya.","j":"Perkembangan","t":"Saat hasilnya meleset, [nama] kini menarik napas dan mencari penyebabnya, tidak lagi cepat kesal. Ketenangan ini sangat membantunya."},{"k":"Umum","p":"Makin Teliti","i":"Dulu ceroboh, kini mengecek ulang sebelum selesai.","j":"Perkembangan","t":"[nama] mulai mengecek ulang hasil kerjanya sebelum dinyatakan selesai, dan kesalahan kecil pun berkurang. Kebiasaan baru ini layak dipertahankan."},{"k":"Umum","p":"Makin Percaya Diri","i":"Dulu ragu menjawab, kini lebih yakin.","j":"Perkembangan","t":"Dulu [nama] sering ragu menjawab, sekarang ia menyampaikannya dengan lebih yakin. Percaya dirinya naik, dan hasilnya sudah terlihat."},{"k":"Umum","p":"Lebih Sabar","i":"Dulu terburu-buru, kini mengerjakan bertahap.","j":"Perkembangan","t":"[nama] kini mengerjakan materi tahap demi tahap, tidak lagi tergesa-gesa. Pemahamannya jadi lebih kokoh karena ritme yang lebih tenang ini."},{"k":"Umum","p":"Makin Rapi","i":"Dulu berantakan, kini file dan hasil kerja tertata.","j":"Perkembangan","t":"File dan hasil kerja [nama] kini tertata tanpa perlu diingatkan. Kerapian ini mempermudahnya mencari apa pun saat dibutuhkan."},{"k":"Umum","p":"Makin Konsisten","i":"Dulu latihan naik turun, kini lebih rutin.","j":"Perkembangan","t":"Latihan [nama] kini jauh lebih rutin dibanding bulan lalu, dan hasilnya stabil. Konsistensi memang pelan, tetapi hasilnya awet."},{"k":"Umum","p":"Lebih Terbuka pada Koreksi","i":"Dulu membela diri saat dikoreksi, kini menerima dan memperbaiki.","j":"Perkembangan","t":"Dulu koreksi terasa berat bagi [nama]. Kini ia menerimanya dan langsung memperbaiki, sikap yang sangat mempercepat belajarnya."},{"k":"Umum","p":"Lebih Bertanggung Jawab","i":"Dulu perlu diingatkan, kini berinisiatif mengerjakan sendiri.","j":"Perkembangan","t":"[nama] kini mengerjakan latihan tanpa perlu diingatkan. Tanggung jawab belajarnya mulai berpindah ke tangannya sendiri, dan itu tepat."},{"k":"Umum","p":"Tidak Muda x Makin Pas","i":"Kotak penanda objek yang kemarin salah letak kini sukses menempel tepat pinggiran benda.","j":"Perkembangan","t":"Sempat kesulitan menentukan koordinat, hari ini bingkai pelacakan [nama] mengunci objek dengan pas. Pemetaan batas luar bendanya rapi.","g":{"11":4,"17":5}},{"k":"Computer Vision","p":"Mengekstrak Bentuk Lengkung","i":"Sukses membingkai lengkung benda yang di pertemuan lalu gagal terdeteksi alur tepiannya.","j":"Perkembangan","t":"[nama] meninggalkan deteksi tepi sederhana dan kini bisa mengekstrak bentuk lengkung secara utuh. Pemahamannya membaca wujud benda lewat struktur melompat maju.","g":{"11":6,"17":5}},{"k":"Computer Vision","p":"Blur Gaussian Merapikan Sudut","i":"Mengganti crop bergelombang jadi mulus lewat teknik pemisahan berbasis filter Gaussian Blur.","j":"Perkembangan","t":"Pekan lalu hasil potongan [nama] masih kasar, hari ini filter Gaussian merapikan sudut benda. Pemahamannya soal kernel konvolusi mulai terbukti.","g":{"11":2}},{"k":"Computer Vision","p":"Berani Membedah Kegagalan","i":"Jujur menampilkan cuplikan modelnya di kondisi saat gagal mengenali profil dengan wajah terhalang.","j":"Perkembangan","t":"[nama] tidak menyembunyikan gambar yang salah dideteksi dan berani membedah penyebabnya. Sikap ilmiah dan analitis seperti ini patut dipuji.","g":{"11":0,"17":0}}]};
var C=DATA.C,F=DATA.F,jenis=null,$=function(i){return document.getElementById(i)};
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function fill(sel,items,keep){var old=sel.value;sel.innerHTML="";items.forEach(function(v){var o=document.createElement("option");o.value=v[0];o.textContent=v[1];sel.appendChild(o)});if(keep&&items.some(function(v){return v[0]===old}))sel.value=old}
function cur(){var c=C[+$("course").value];var ln=+$("lesson").value;return {c:c,ci:+$("course").value,ln:ln,l:c.lessons.filter(function(l){return l.n===ln})[0]}}
function avail(){var s=cur();return F.map(function(f,i){return [f,i]}).filter(function(p){var f=p[0];return !f.g||(f.g[s.ci]!==undefined&&f.g[s.ci]<=s.ln)})}
function buildCourses(){
  var cr=$("crit").value;
  fill($("course"),C.map(function(c,i){return [String(i),c.name]}).filter(function(p){return C[+p[0]].crit===cr}),false);
  buildLessons();
}
function buildLessons(){
  var s=C[+$("course").value];
  fill($("lesson"),s.lessons.map(function(l){return [String(l.n),l.n+". "+l.t]}),true);
  buildJenis();
}
function buildJenis(){
  var list=uniq(avail().map(function(p){return p[0].j}));
  if(list.indexOf(jenis)<0)jenis=list[0]||null;
  var box=$("jenis");box.innerHTML="";
  list.forEach(function(j){var b=document.createElement("button");b.type="button";b.textContent=j;b.setAttribute("aria-pressed",j===jenis);b.onclick=function(){jenis=j;buildJenis()};box.appendChild(b)});
  buildTypes();
}
function buildTypes(){
  var sel=$("type"),old=sel.value;sel.innerHTML="";
  var rows=avail().filter(function(p){return p[0].j===jenis});
  uniq(rows.map(function(p){return p[0].k})).sort(function(a,b){return a==="Umum"?-1:b==="Umum"?1:a<b?-1:1}).forEach(function(k){
    var g=document.createElement("optgroup");g.label=k==="Umum"?"Sifat murid (umum)":"Teknis · "+k;
    rows.filter(function(p){return p[0].k===k}).forEach(function(p){var o=document.createElement("option");o.value=p[1];o.textContent=p[0].p;g.appendChild(o)});
    sel.appendChild(g)});
  if(old&&sel.querySelector('option[value="'+old+'"]'))sel.value=old;
  render();
}
function nm(){return $("name").value.trim()||"[nama]"}
function render(){
  var out=$("out"),btn=$("copy"),sel=$("type");
  if(!sel.value){out.className="empty";out.textContent="Belum ada feedback untuk pilihan ini.";btn.disabled=true;$("hint").textContent="";return}
  var f=F[+sel.value],s=cur();$("hint").textContent=f.i||"";
  var fbTxt=f.t.split("[nama]").join(nm());
  out.className="";out.textContent="";
  if($("incl").checked&&s.l){var m=document.createElement("span");m.className="m";m.textContent=s.l.x.split("{nama}").join(nm())+"\n\n";out.appendChild(m)}
  out.appendChild(document.createTextNode(fbTxt));
  btn.disabled=false;
}
function flash(m){var s=$("status");s.textContent=m;clearTimeout(flash.t);flash.t=setTimeout(function(){s.textContent=""},2000)}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt);
  return new Promise(function(res,rej){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy")?res():rej()}catch(e){rej(e)}a.remove()});
}
fill($("crit"),uniq(C.map(function(c){return c.crit})).map(function(v){return [v,v]}),false);
$("name").addEventListener("input",render);
$("crit").addEventListener("change",buildCourses);
$("course").addEventListener("change",buildLessons);

$("type").addEventListener("change",render);
$("incl").addEventListener("change",render);
$("copy").onclick=function(){
  var b=$("copy"),t=$("out").innerText.replace(/\n{3,}/g,"\n\n").trim();
  copyText(t).then(function(){flash("Teks berhasil disalin!");b.classList.add("done");setTimeout(function(){b.classList.remove("done")},150)},function(){flash("Gagal menyalin. Tekan lama teks lalu salin manual.")});
};
