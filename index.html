<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feedback">
<title>Feedback Generator</title>
<style>
:root{--bg:#eef1ec;--card:#fbfcfa;--ink:#1c2b26;--mute:#5d6e67;--line:#cfd8d1;--acc:#1f6f54;--acc-ink:#fff;--out:#e3e9e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a16;--card:#18241f;--ink:#e6efe9;--mute:#9db0a6;--line:#2c3d36;--acc:#5fcf9f;--acc-ink:#07140f;--out:#0f1814}}
:root[data-theme="dark"]{--bg:#111a16;--card:#18241f;--ink:#e6efe9;--mute:#9db0a6;--line:#2c3d36;--acc:#5fcf9f;--acc-ink:#07140f;--out:#0f1814}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 18px}
label{display:block;font-weight:700;font-size:.9rem;margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
#name{font-size:1.25rem;padding:16px 14px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:inherit;font-weight:700;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#out{margin-top:22px;background:var(--out);border-radius:12px;padding:18px;min-height:130px;font:400 1.08rem/1.65 Georgia,serif;white-space:pre-wrap}
#out.empty{color:var(--mute);font-style:italic}
#copy{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:1.1rem;padding:16px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
#copy:disabled{opacity:.45;cursor:not-allowed}
#copy.done{transform:scale(.98)}
#status{min-height:1.4em;text-align:center;margin:8px 0 0;font-weight:700;color:var(--acc)}
.alt{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;color:var(--mute);font-size:.9rem}
.alt button{font:inherit;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
details{margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:700}
textarea{height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;margin-top:10px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.hint{margin:6px 2px 0;color:var(--mute);font-size:.88rem}
small{color:var(--mute)}
@media (prefers-reduced-motion:no-preference){#copy{transition:transform .12s}}
</style>
</head>
<body>
<main>
<h1>Feedback Generator</h1>

<label for="name">Nama student</label>
<input id="name" type="text" autocomplete="off" placeholder="Ketik nama…">

<label for="cat">Kategori</label>
<select id="cat"></select>

<label id="jl">Jenis feedback</label>
<div class="seg" id="jenis" role="group" aria-labelledby="jl"></div>

<label for="type">Tipe murid</label>
<select id="type"></select>
<p id="hint" class="hint"></p>

<div id="out" class="empty" aria-live="polite">Pilih kategori dan tipe murid untuk melihat feedback.</div>
<div class="alt" id="alt" hidden><span id="count"></span><button id="next" type="button">Variasi lain</button></div>
<button id="copy" type="button" disabled>Copy to Clipboard</button>
<p id="status" role="status"></p>

<details>
<summary>Ganti data feedback (JSON)</summary>
<small>Tempel isi <code>feedbackData.json</code> berisi daftar objek dengan kunci <code>kategori</code>, <code>tipe</code>, <code>jenis</code>, <code>template</code>. Gunakan <code>[nama]</code> sebagai penanda nama. Data tersimpan di browser ini saja.</small>
<textarea id="json" spellcheck="false" aria-label="Data JSON"></textarea>
<div class="row"><button id="apply" type="button">Pakai data ini</button><button id="reset" type="button">Kembali ke data bawaan</button></div>
<p id="msg"></p>
</details>
</main>

<script>
var SAMPLE=[{"kategori":"General","tipe":"Rajin Mencatat Instruksi","indikator":"Menulis rincian tugas di bukunya saat pengajar sedang menjelaskan di depan.","jenis":"Apresiasi","template":"[nama], kamu mencatat urutan instruksi di buku sebelum mulai bekerja, dan hasilnya terasa: tidak ada tahap yang terlewat. Kebiasaan kecil ini enak dipertahankan."},{"kategori":"General","tipe":"Berani Bertanya Saat Buntu","indikator":"Mengangkat tangan menanyakan solusi sebelum dirinya menghabiskan waktu sia-sia.","jenis":"Apresiasi","template":"Saat mentok, [nama] tidak diam saja dan langsung bertanya. Itu cara belajar yang sehat, apalagi waktu pengerjaanmu jadi lebih hemat. Tetap berani minta arahan ya."},{"kategori":"General","tipe":"Teman Setim yang Suportif","indikator":"Rela bergeser tempat untuk membantu menjelaskan materi kepada teman yang tertinggal.","jenis":"Apresiasi","template":"[nama] membantu teman sebangku yang tertinggal tanpa langsung membocorkan jawaban. Caramu pas, temanmu tetap berpikir sendiri dan suasana kelas ikut enak."},{"kategori":"General","tipe":"Pandai Mengatur Waktu","indikator":"Selesai membagi porsi riset dan praktik sehingga proyek kelar sebelum tenggat.","jenis":"Apresiasi","template":"Pembagian waktumu antara riset dan pengerjaan rapi, [nama], jadi proyek selesai sebelum tenggat tanpa panik. Teruskan caramu menyusun jadwal sendiri."},{"kategori":"General","tipe":"Jago Menjelaskan Alur Pikir","indikator":"Mampu merangkum inti masalah dan mendeskripsikan langkah perbaikannya lisan.","jenis":"Apresiasi","template":"Penjelasan [nama] di depan kelas pakai bahasa yang gampang diikuti, sehingga teman-temanmu cepat paham. Latih terus, kemampuan ini akan sering terpakai."},{"kategori":"General","tipe":"Tahan Gangguan","indikator":"Tak ikut mengobrol meski suasana kelas sedang ramai, matanya terus fokus ke tugas.","jenis":"Apresiasi","template":"Kelas sedang ramai, tapi [nama] tetap fokus ke layarnya sendiri. Tidak semua orang bisa begitu. Jaga kemampuan ini karena tugas-tugas berikutnya akan butuh."},{"kategori":"General","tipe":"Terbuka pada Revisi","indikator":"Menerima kritikan rekan setim dan langsung memodifikasi ulang pekerjaannya.","jenis":"Apresiasi","template":"[nama] menerima masukan teman satu kelompok dengan lapang, dan makalahnya jadi lebih tajam setelah direvisi. Sikap ini layak dijaga, terutama saat masukannya kurang enak didengar."},{"kategori":"General","tipe":"Siap Sebelum Mulai","indikator":"Buku, perangkat, dan aplikasi sudah menyala sebelum pengajar mengucapkan salam.","jenis":"Apresiasi","template":"Perangkat dan alat tulis [nama] sudah tertata di meja sebelum bel berbunyi, jadi kamu bisa langsung belajar. Kebiasaan tepat waktu seperti ini jarang dimiliki, jangan dilepas."},{"kategori":"General","tipe":"Pantang Menyerah","indikator":"Gagal tiga kali namun terus mencoba metode alternatif tanpa membuang muka lelah.","jenis":"Apresiasi","template":"Ketika proyeknya mentok, [nama] mencoba tiga cara berbeda sebelum minta bantuan. Itu ketekunan yang nyata. Bawa terus sikap ini walau tugasnya makin sulit."},{"kategori":"General","tipe":"Pemimpin Kelompok yang Adil","indikator":"Berkeliling memastikan setiap rekan timnya punya jatah kerja, bukan memonopoli.","jenis":"Apresiasi","template":"[nama] membagi peran dalam tugas kelompok dengan adil sehingga semua anggota ikut bekerja. Gaya memimpinmu enak diikuti, dan tetap beri ruang untuk teman yang pendiam."},{"kategori":"General","tipe":"Suka Menunda Mulai","indikator":"Sering santai di awal kelas dan mendadak panik mengerjakan tugas jelang bel akhir.","jenis":"Perbaikan","template":"[nama] baru mulai mengerjakan tugas ketika waktu kelas hampir habis, jadi hasilnya belum maksimal. Coba mulai dari langkah paling kecil di menit pertama agar akhirnya tidak terburu-buru."},{"kategori":"General","tipe":"Gampang Terdistraksi","indikator":"Minim progres karena tab browsernya selalu terbuka pada halaman non-akademik.","jenis":"Perbaikan","template":"Perhatian [nama] masih sering pindah ke aplikasi hiburan saat sesi mandiri. Tutup dulu tab yang tidak dipakai, lalu kerjakan sampai tuntas. Targetnya hari ini masih terkejar kok."},{"kategori":"General","tipe":"Mendominasi Diskusi","indikator":"Bersemangat namun tidak memberikan jeda udara agar rekan lain bisa bicara idenya.","jenis":"Perbaikan","template":"Kamu aktif sekali berdiskusi, [nama], dan itu bagus. Hanya saja teman lain kadang belum sempat bicara. Beri jeda sebentar, lalu tanyakan pendapat mereka."},{"kategori":"General","tipe":"Bertanya Sebelum Mencoba","indikator":"Menjumpai rintangan dan langsung memanggil pengajar tanpa mencoba googling dulu.","jenis":"Perbaikan","template":"[nama], sebelum bertanya ke pengajar, coba telusuri dulu sendiri di mana letak salahnya, misalnya dengan membaca ulang langkah terakhir. Kebiasaan itu melatih ketajaman analisismu."},{"kategori":"General","tipe":"Lupa Catatan Revisi","indikator":"Mengumpulkan draf kedua yang masih membawa kesalahan sama dari lembar evaluasi.","jenis":"Perbaikan","template":"Beberapa catatan revisi minggu lalu belum terlihat di tugas [nama] hari ini. Sebelum mengumpulkan, baca lagi lembar evaluasinya dan centang satu per satu."},{"kategori":"General","tipe":"Ngebut tapi Kurang Teliti","indikator":"Tugasnya selalu kelar paling pertama, tapi formatnya tak sesuai dan sering melenceng.","jenis":"Perbaikan","template":"[nama] cepat menyelesaikan tugas, tapi banyak detail jadi berantakan. Sisihkan beberapa menit sebelum mengumpulkan untuk mengecek ulang. Cepat itu bagus kalau hasilnya juga rapi."},{"kategori":"General","tipe":"Pasif di Kerja Kelompok","indikator":"Datang ke meja kelompok namun tak membawa alat tulis, hanya mendengarkan pasif.","jenis":"Perbaikan","template":"Kontribusi [nama] di proyek kelompok kali ini masih sedikit. Tidak perlu menunggu disuruh, tawarkan saja bantuan atau sampaikan idemu ke teman satu kelompok."},{"kategori":"General","tipe":"Melamun Saat Instruksi","indikator":"Sering bertanya, \"Tadi disuruh buat apa?\" segera sesudah instruksi selesai diberikan.","jenis":"Perbaikan","template":"[nama] sering melamun ketika instruksi lisan disampaikan, lalu bingung menentukan langkah proyeknya. Saat pengajar bicara, arahkan pandangan ke depan dan catat poin pentingnya."},{"kategori":"General","tipe":"Cepat Menyerah","indikator":"Baru meriset lima menit, mendadak menutup laptop sambil mengatakan tugasnya mustahil.","jenis":"Perbaikan","template":"Menghadapi soal logika bertingkat, [nama] masih mudah menyerah. Coba pecah soalnya jadi bagian kecil dan kerjakan satu per satu. Yang tadinya terasa berat biasanya jadi masuk akal."},{"kategori":"General","tipe":"Suka Menyela","indikator":"Memotong saat guru atau rekan sekelas belum usai menamatkan poin kalimatnya.","jenis":"Perbaikan","template":"Antusiasmemu bagus, [nama], tapi menyela teman yang sedang presentasi kurang pas. Tulis dulu sanggahanmu di kertas, lalu sampaikan setelah dia selesai bicara."},{"kategori":"General","tipe":"Fokus Makin Tahan","indikator":"Dulu mudah mendongak saat pintu diketuk, kini kebal pada interupsi kebisingan mikro.","jenis":"Perkembangan","template":"Pekan lalu [nama] masih gampang terganggu suara dari luar, dan hari ini fokusmu selama jam mandiri jauh lebih stabil. Pertahankan, tugas akhirmu akan terbantu."},{"kategori":"General","tipe":"Mulai Berani Bertanya","indikator":"Selalu diam di sesi berlalu, kini berani mengacungkan jarinya untuk bertanya mandiri.","jenis":"Perkembangan","template":"Hari ini [nama] mengangkat tangan untuk menanyakan istilah yang membingungkan. Dibanding sebelumnya, itu lompatan besar. Rasa ingin tahu seperti ini bikin pemahamanmu makin kuat."},{"kategori":"General","tipe":"Laporan Makin Rapi","indikator":"Jika dulunya dokumen acak-acakan, format tugas penyerahan kini rapi selaras modul.","jenis":"Perkembangan","template":"Laporan [nama] kali ini tersusun jauh lebih rapi dari draf sebelumnya, dan datanya lebih mudah dibaca. Tinggal dijaga, sudah mulai terlihat profesional."},{"kategori":"General","tipe":"Mulai Mau Berbagi Tugas","indikator":"Menanggalkan ego kerjanya, ikhlas berbagi sebagian skrip besarnya dengan anggota tim.","jenis":"Perkembangan","template":"Dulu [nama] lebih suka bekerja sendiri. Sekarang kamu mulai membagi sebagian tugas ke anggota regumu. Perubahan ini patut dibanggakan, lanjutkan kerja samanya."},{"kategori":"General","tipe":"Cepat Menerapkan Saran","indikator":"Dulu keras kepala saat ditegur, kini responsif menekan Ctrl+Z memperbaikinya saat itu juga.","jenis":"Perkembangan","template":"Masukan lisan soal tata letak halaman langsung [nama] terapkan hari ini, jauh lebih cepat dari biasanya. Sikapmu terhadap koreksi sudah dewasa. Pertahankan."},{"kategori":"General","tipe":"Tidak Telat Lagi","indikator":"Transisi dari mengumpul h+1 menjadi h-0 berkat pemangkasan waktu leyeh-leyeh awal.","jenis":"Perkembangan","template":"Sebelumnya [nama] sering terlambat mengumpulkan tugas, dan hari ini selesai tepat waktu. Pengaturan jadwal harianmu mulai terbentuk, jaga ritmenya."},{"kategori":"General","tipe":"Makin Percaya Diri","indikator":"Menyampaikan laporannya menatap mata audiens, tidak lagi terpaku membaca layar.","jenis":"Perkembangan","template":"Saat presentasi hari ini, suara dan gestur [nama] terlihat jauh lebih mantap. Keraguan yang dulu ada sudah banyak berkurang. Itu kemajuan nyata, teruskan."},{"kategori":"General","tipe":"Makin Bertanggung Jawab","indikator":"Bersedia kembali duduk menyunting kerjanya sendiri karena tahu kodenya merusak milik tim.","jenis":"Perkembangan","template":"[nama] merevisi bagian tugasnya sendiri di akhir pekan tanpa diminta. Tanggung jawab seperti ini yang membuat teman satu tim makin percaya padamu."},{"kategori":"General","tipe":"Makin Mandiri","indikator":"Dulu harus disetir tiap dua baris kode, kini tenang bekerja sendiri menyisir modul teori.","jenis":"Perkembangan","template":"Dibanding awal semester, [nama] sekarang jauh lebih jarang butuh panduan langkah demi langkah. Kamu mulai berani mencari jalan sendiri, dan itu memang tujuan belajar kita."},{"kategori":"General","tipe":"Lebih Tenang Saat Buntu","indikator":"Menelan kekecewaan kodenya yang hilang, tak marah, tapi langsung mengetik ulang pelan.","jenis":"Perkembangan","template":"Saat buntu, [nama] tidak lagi panik. Kamu menarik napas dulu, lalu mencari solusi dengan kepala dingin. Kemajuan sikap yang bagus, pertahankan."},{"kategori":"Python","tipe":"Merencanakan Alur Dulu","indikator":"Menulis komentar atau pseudocode sebelum mulai mengetik sintaks.","jenis":"Apresiasi","template":"[nama], menulis alur logika di komentar sebelum mengetik kode terbukti membantumu menghindari error. Kebiasaan ini akan berguna lagi saat proyeknya makin panjang."},{"kategori":"Python","tipe":"Membaca Pesan Error","indikator":"Menggulir ke terminal dan membaca baris error alih-alih panik saat gagal run.","jenis":"Apresiasi","template":"[nama] membaca pesan error di terminal untuk mencari baris yang bermasalah, dan itu kebiasaan debugging yang bagus. Lanjutkan, kamu makin mandiri dengan cara ini."},{"kategori":"Python","tipe":"Nama Variabel Jelas","indikator":"Membuat nama variabel yang bermakna (misal: harga_total bukan x).","jenis":"Apresiasi","template":"Nama variabel buatan [nama] menjelaskan isinya sendiri, jadi kode Python-mu enak dibaca orang lain. Terapkan terus, bahkan untuk skrip yang cuma sepuluh baris."},{"kategori":"Python","tipe":"Teliti Indentasi","indikator":"Selalu memperhatikan jumlah spasi di dalam blok if atau for.","jenis":"Apresiasi","template":"[nama] merapikan indentasi di blok for dengan teliti, jadi IndentationError tidak muncul lagi. Jaga ketelitian ini supaya programmu langsung jalan."},{"kategori":"Python","tipe":"Debugging dengan Print","indikator":"Menyisipkan perintah print() untuk melihat nilai variabel di tengah proses.","jenis":"Apresiasi","template":"Menyisipkan print untuk memantau nilai variabel adalah cara [nama] melacak masalah, dan cara itu ampuh. Coba dulu sebelum memanggil pengajar."},{"kategori":"Python","tipe":"Memecah Kode ke Fungsi","indikator":"Menggunakan blok def untuk memisahkan logika program menjadi bagian kecil.","jenis":"Apresiasi","template":"[nama] memecah kode yang panjang jadi beberapa fungsi def, sehingga alur programnya lebih jelas. Latih terus supaya kodemu gampang dikembangkan nanti."},{"kategori":"Python","tipe":"Membangun Sedikit demi Sedikit","indikator":"Menjalankan dan menguji program setelah menulis 1-2 baris logika.","jenis":"Apresiasi","template":"[nama] selalu mengetes kode dulu sebelum menambah logika baru, jadi error tidak menumpuk. Pakai cara bertahap ini juga untuk tugas akhir nanti."},{"kategori":"Python","tipe":"Rajin Memberi Komentar","indikator":"Rutin menambahkan teks komentar (#) untuk menjelaskan blok kode yang rumit.","jenis":"Apresiasi","template":"Terima kasih, [nama], sudah rutin menulis komentar di setiap fungsi. Teman satu timmu jadi lebih mudah memahami kodemu saat kerja kolaborasi."},{"kategori":"Python","tipe":"Pandai Memakai List","indikator":"Mampu memanipulasi data menggunakan list (tambah, hapus, akses indeks).","jenis":"Apresiasi","template":"[nama] sudah paham memakai list untuk menyimpan banyak data sekaligus. Langkah berikutnya, coba dictionary untuk data yang punya label."},{"kategori":"Python","tipe":"Perhitungan Akurat","indikator":"Menerapkan operator aritmatika dan modulo dengan tepat sesuai aturan matematika.","jenis":"Apresiasi","template":"Operator matematika di kode [nama] sudah menghasilkan hitungan yang benar. Tetap perhatikan urutan operasinya agar hasilnya selalu bisa kamu prediksi."},{"kategori":"Python","tipe":"Langsung Hapus Kode Error","indikator":"Langsung menghapus atau mengubah kode secara acak saat muncul teks merah.","jenis":"Perbaikan","template":"Melihat teks merah di terminal, [nama] masih langsung menghapus kodenya. Baca dulu petunjuk baris errornya, baru ubah sintaks yang memang perlu diubah."},{"kategori":"Python","tipe":"Lupa Titik Dua","indikator":"Sering mendapatkan SyntaxError karena lupa tanda titik dua (:) atau kurung.","jenis":"Perbaikan","template":"Di materi if, [nama] beberapa kali lupa titik dua di akhir baris. Sebelum menjalankan program, cek ulang tanda bacanya baris demi baris."},{"kategori":"Python","tipe":"Nama Variabel Tertimpa","indikator":"Menggunakan nama variabel yang sama untuk dua data yang berbeda, menyebabkan bug.","jenis":"Perbaikan","template":"[nama] memakai nama variabel yang sama berulang kali sehingga data lama tertimpa. Beri nama berbeda untuk tiap nilai supaya logikamu tetap aman."},{"kategori":"Python","tipe":"Loop Tidak Berhenti","indikator":"Membuat perulangan while yang tidak memiliki statemen pembaharuan atau break.","jenis":"Perbaikan","template":"Program while buatan [nama] sering berjalan tanpa henti karena tidak ada kondisi berhenti. Pastikan ada variabel penambah atau break di dalam loop."},{"kategori":"Python","tipe":"Mencampur String dan Angka","indikator":"Berusaha menggabungkan data integer dengan string secara langsung menggunakan +.","jenis":"Perbaikan","template":"Error tipe data muncul karena [nama] menggabungkan string dan integer secara langsung. Ingat pakai str() dulu sebelum menyambung keluarannya."},{"kategori":"Python","tipe":"Menyalin Tanpa Menyesuaikan","indikator":"Menggunakan potongan kode contoh tanpa menyesuaikan nama variabel dengan tugas.","jenis":"Perbaikan","template":"Menyalin contoh kode memang boleh, tapi [nama] perlu menyesuaikan nama variabel dengan konteks tugas. Ubah beberapa bagian supaya programnya cocok dengan kebutuhanmu."},{"kategori":"Python","tipe":"If Beruntun Tumpang Tindih","indikator":"Menggunakan banyak if berurutan sehingga eksekusi program bertabrakan.","jenis":"Perbaikan","template":"Kondisi if yang berurutan membuat logika program [nama] saling tumpang tindih. Latih memakai elif agar percabangan kodemu lebih efisien."},{"kategori":"Python","tipe":"Mengubah Kode Secara Acak","indikator":" janggal. Sesuaikan material dengan fungsi benda itu di dunia nyata."},{"kategori":"Roblox Designer","tipe":"Celah di Sudut Dinding","indikator":"Membiarkan adanya celah yang berlubang karena dinding tidak terhubung rapat.","jenis":"Perbaikan","template":"Di pertemuan dua dinding bata rumah [nama] masih ada celah berlubang. Matikan Collisions sementara agar kamu bisa merapatkan kedua tembok dengan presisi."},{"kategori":"Roblox Designer","tipe":"Kamera Sering Hilang","indikator":"Sering kehilangan kendali layar di editor karena terlempar jauh dari objek utama.","jenis":"Perbaikan","template":"Saat mengedit atap, pandangan layar [nama] sering terlempar jauh dari objek. Tekan F di keyboard untuk mengembalikan fokus ke benda yang dipilih."},{"kategori":"Roblox Designer","tipe":"Anchor Makin Disiplin","indikator":"Mulai otomatis mengunci part baru sehingga struktur karyanya aman dan kokoh saat diuji.","jenis":"Perkembangan","template":"Minggu lalu banyak tiang ambruk, hari ini seluruh jembatan [nama] tetap kokoh saat dimainkan. Kamu mulai paham pentingnya mengunci objek."},{"kategori":"Roblox Designer","tipe":"Simetri Makin Baik","indikator":"Sempat kesulitan menyejajarkan balok, kini dinding buatannya mulai lurus.","jenis":"Perkembangan","template":"Pilar istana buatan [nama] hari ini jauh lebih sejajar dari sesi sebelumnya. Kebiasaan baru memakai grid snap terlihat hasilnya pada karyamu."},{"kategori":"Roblox Designer","tipe":"Folder Makin Rapi","indikator":"Membersihkan Explorer-nya dengan fitur Group tanpa harus disuruh lagi.","jenis":"Perkembangan","template":"Folder di Explorer [nama] sekarang tertata tanpa perlu diingatkan. Dengan kerapian seperti ini, kamu sudah siap menggarap peta bersama tim besar."},{"kategori":"Roblox Designer","tipe":"Mulai Bermain Cahaya","indikator":"Pindah dari warna neon terang menuju penataan bohlam cahaya PointLight asli.","jenis":"Perkembangan","template":"[nama] menambahkan sumber cahaya sungguhan di bawah lampu jalan, tidak hanya mengganti warna neon. Peta malam buatanmu jadi makin dramatis."},{"kategori":"Roblox Designer","tipe":"Mulai Memahat Bentuk","indikator":"Sudah berani memotong bangun ruang rumit dibandingkan awal kelas.","jenis":"Perkembangan","template":"[nama] berhasil membuat lubang jendela dengan memotong bagian tengah balok memakai union dan negate. Dengan kemampuan ini, bangunan yang lebih rumit sudah terjangkau."},{"kategori":"Roblox Designer","tipe":"Dekorasi dengan Decal","indikator":"Menggunakan gambar tempel (Decal) untuk menambah hiasan poster atau wajah.","jenis":"Apresiasi","template":"Decal bingkai jendela dan motif kayu di dinding rumah [nama] menghadirkan suasana ruang tamu yang terasa nyata. Pertahankan selera detail seperti ini."},{"kategori":"Roblox Designer","tipe":"Jarak Pijakan Pas","indikator":"Mendesain lompatan Obby yang proporsional sehingga bisa dimenangkan, bukan frustrasi.","jenis":"Apresiasi","template":"Jarak antarpijakan di arena rintangan buatan [nama] pas untuk dilompati avatar standar. Kamu jelas paham tata ruang arena."},{"kategori":"Roblox Designer","tipe":"Interior Bisa Dimasuki","indikator":"Bersedia meluangkan waktu memikirkan lantai ruang dalam, bukan hanya luar bangunan.","jenis":"Apresiasi","template":"Interior kedai kopi rancangan [nama] punya kedalaman dan bisa dimasuki pemain. Menyusun dinding part demi part itu butuh ketekunan, dan hasilnya terlihat."},{"kategori":"Roblox Designer","tipe":"Bentuk Makin Beragam","indikator":"Tidak hanya terpaku memakai balok, namun melengkungkannya dengan silinder.","jenis":"Perkembangan","template":"Rumah pertama [nama] hanya berupa balok kaku, sedangkan tenda kali ini sudah memakai prisma segitiga yang miring. Variasi bentukmu berkembang pesat."},{"kategori":"Roblox Designer","tipe":"Berani Menata Ulang","indikator":"Merombak layout awal secara sukarela agar suasana tidak sumpek atau lengang.","jenis":"Perkembangan","template":"[nama] mengatur ulang properti jalanan setelah sadar kotanya terlalu sempit, dan itu sikap yang patut dipuji. Berani membongkar layout adalah cara berpikir perancang."},{"kategori":"Roblox Coder","tipe":"Script Tersusun Rapi","indikator":"Menulis variabel di bagian atas, fungsi di tengah, dan event connection di bawah.","jenis":"Apresiasi","template":"[nama] menaruh deklarasi variabel di atas dan fungsi di bawah, sehingga script Lua-nya mudah dibaca. Pertahankan susunan rapi ini di game berikutnya."},{"kategori":"Roblox Coder","tipe":"Memakai Event Touched","indikator":"Menggunakan event .Touched untuk memicu efek dengan tepat saat objek bersentuhan.","jenis":"Apresiasi","template":"Event Touched yang [nama] pakai untuk memicu pengurangan darah pemain berjalan sesuai rencana. Coba juga pemicu lain, misalnya klik pada objek."},{"kategori":"Roblox Coder","tipe":"Menyimpan Objek di Variabel","indikator":"Menyimpan path atau referensi objek ke dalam local variabel sebelum mengolahnya.","jenis":"Apresiasi","template":"[nama] menyimpan alamat objek dalam variabel lokal, jadi script tidak perlu menulis hal yang sama berulang. Cara ini terasa penting begitu game-nya makin besar."},{"kategori":"Roblox Coder","tipe":"Membaca Output Sendiri","indikator":"Mandiri memeriksa jendela Output yang merah sebelum memanggil pengajar untuk mengeluh.","jenis":"Apresiasi","template":"[nama] membaca jendela Output sendiri untuk menemukan letak kesalahan script. Teruskan, cek panel itu dulu sebelum bertanya ke instruktur."},{"kategori":"Roblox Coder","tipe":"Debounce Sudah Dipakai","indikator":"Menambahkan variabel statis sementara agar event tidak tereksekusi puluhan kali per detik.","jenis":"Apresiasi","template":"Variabel jeda atau debounce di script [nama] berhasil menghentikan benturan yang terdeteksi berulang. Itu cara menulis script yang sudah dewasa."},{"kategori":"Roblox Coder","tipe":"Logika Skor Terpisah","indikator":"Memisahkan bagian kalkulasi yang rumit menjadi function agar bisa dipakai ulang.","jenis":"Apresiasi","template":"[nama] memisahkan logika pemberian skor ke fungsi tersendiri, dan struktur Lua-mu terlihat kokoh. Terapkan terus supaya kodenya ringkas saat dipanggil."},{"kategori":"Roblox Coder","tipe":"Loop dengan Jeda","indikator":"Sadar akan pentingnya task.wait() saat membuat perulangan abadi seperti while true do.","jenis":"Apresiasi","template":"Dengan menyisipkan task.wait di dalam loop while, [nama] menjaga studio tetap lancar tanpa lag. Jadikan jeda ini kebiasaan di setiap loop."},{"kategori":"Roblox Coder","tipe":"Komentar di Script","indikator":"Menambahkan -- untuk mencatat arti sebuah blok sintaks, terutama logika yang kompleks.","jenis":"Apresiasi","template":"Komentar hijau yang [nama] tulis di atas setiap fungsi memudahkan anggota tim desain memahami kodenya. Lanjutkan di script yang panjang."},{"kategori":"Roblox Coder","tipe":"Memakai Parameter hit","indikator":"Sukses mengirimkan informasi hit dan menggunakannya dalam logika pemrosesan internal.","jenis":"Apresiasi","template":"Parameter hit di fungsi [nama] berhasil mengenali bagian tubuh pemain yang menyentuh objek. Dengan cara mengirim data seperti ini, merancang alur rintangan jadi lebih mudah."},{"kategori":"Roblox Coder","tipe":"Menghubungkan GUI ke Objek","indikator":"Menyambungkan penekanan di layar dengan fungsi perubahan sistem objek 3D Workspace.","jenis":"Apresiasi","template":"[nama] memprogram tombol di layar sampai bisa mengubah warna objek di dunia 3D, dan itu capaian yang bagus. Jelajahi terus hubungan antara antarmuka dan objek sekitar."},{"kategori":"Roblox Coder","tipe":"Loop Tanpa Jeda","indikator":"Menerapkan while tanpa jeda sehingga mesin komputer langsung freeze (crash).","jenis":"Perbaikan","template":"Game sempat berhenti merespons karena loop [nama] berjalan terus tanpa jeda. Selipkan wait di dalam while supaya sistem sempat bernapas."},{"kategori":"Roblox Coder","tipe":"Salah Huruf Kapital","indikator":"Menemui pesan error terkait anggota tipe data karena lupa bahwa Lua sangat case sensitive.","jenis":"Perbaikan","template":"Beberapa pesan error di tugas [nama] datang dari penulisan properti yang besar kecil hurufnya tidak cocok. Luau membedakan huruf kapital, jadi tulis persis."},{"kategori":"Roblox Coder","tipe":"Path Objek Tidak Lengkap","indikator":"Memanggil nama bagian tanpa merujuk lokasi game.Workspace, sehingga objek tidak terdeteksi.","jenis":"Perbaikan","template":"Script [nama] belum jalan karena nama part dipanggil tanpa menyebut induknya di Workspace. Lengkapi alamat objeknya agar komputer tahu persis benda yang dicari."},{"kategori":"Roblox Coder","tipe":"Lupa Menutup dengan end","indikator":"Kekurangan blok kata penutup end sehingga warna garis bawah editor menjadi merah bersusun.","jenis":"Perbaikan","template":"Garis merah di kode [nama] menandakan end pada logika if belum ditulis. Begitu membuka fungsi, langsung ketik penutupnya supaya tidak ada struktur yang terpotong."},{"kategori":"Roblox Coder","tipe":"Event Terpicu Berkali-kali","indikator":"Efek yang ditulisnya meledak tak terbatas karena tidak ada penjaga boolean (debounce).","jenis":"Perbaikan","template":"Efek skor di game [nama] masih dijalankan puluhan kali saat part tersentuh. Tambahkan debounce dengan satu variabel agar efeknya hanya terpicu sekali."},{"kategori":"Roblox Coder","tipe":"Script di Tempat Salah","indikator":"Meletakkan kontrol GUI LocalScript di dalam folder server, bukan di area khusus klien.","jenis":"Perbaikan","template":"Antarmuka [nama] belum berfungsi karena script-nya ditaruh di Workspace biasa. Logika tampilan layar pemain harus berada di StarterGui."},{"kategori":"Roblox Coder","tipe":"Mencampur Angka dan Teks","indikator":"Menyambung tipe number poin dengan karakter teks tanpa menggunakan fungsi konversi tostring.","jenis":"Perbaikan","template":"Angka di papan skor [nama] gagal tampil karena angka dan teks digabung langsung. Ubah dulu angkanya dengan tostring, baru disambung."},{"kategori":"Roblox Coder","tipe":"Jarang Mengecek Output","indikator":"Saat kodenya tidak berjalan, seketika berhenti mencoba karena tidak melihat log warna merah.","jenis":"Perbaikan","template":"Saat kodenya tidak jalan, [nama] belum terbiasa melihat peringatan merah dari sistem. Buka tab Output di bawah layar dan cari sendiri baris penyebabnya."},{"kategori":"Roblox Coder","tipe":"Banyak Part Bernama Sama","indikator":"Menaruh nama standar berulang (Part) di dalam folder sama, sehingga script memanggil objek salah.","jenis":"Perbaikan","template":"Script [nama] mengubah objek yang salah karena ada puluhan benda bernama Part di folder yang sama. Beri nama khusus pada tiap benda agar pemanggilannya tidak meleset."},{"kategori":"Roblox Coder","tipe":"Variabel Tanpa local","indikator":"Mengisi deklarasi tanpa awalan local, sehingga memicu konflik antar-skrip di masa mendatang.","jenis":"Perbaikan","template":"Variabel tanpa kata local membuat sebagian data [nama] saling bertabrakan. Awali penulisannya dengan local agar datanya aman."},{"kategori":"Roblox Coder","tipe":"Debounce Mulai Dipakai","indikator":"Mampu menyuntikkan konsep jeda ke event yang sebelumnya sempat merusak permainan akibat tumpang tindih.","jenis":"Perkembangan","template":"Dibanding minggu lalu, efek interaksi objek buatan [nama] hari ini sudah diberi batasan debounce. Kamu mulai paham cara menangani fungsi yang berjalan tumpang tindih."},{"kategori":"Roblox Coder","tipe":"Melacak Error Makin Mandiri","indikator":"Tidak lagi bingung di mana ada salah ketik karena sanggup membaca referensi nomor baris di Output.","jenis":"Perkembangan","template":"[nama] hari ini memperbaiki salah ketik huruf besar hanya dengan membaca nomor baris di Output. Mencari sumber masalah sendiri seperti ini patut dihargai."},{"kategori":"Roblox Coder","tipe":"Path Makin Tepat","indikator":"Mampu membuat urutan pemanggilan game.Workspace.Folder.Part dari induk tanpa ada mata rantai terputus.","jenis":"Perkembangan","template":"Dulu [nama] sempat terbalik menyebut induk benda, tapi urutan pemanggilan an gori":"Computer Vision","tipe":"Salah Ekstensi File","indikator":"Gagal memuat file karena akhiran .PNG diketik .jpg (tidak sesuai kenyataan file aslinya).","jenis":"Perbaikan","template":"Sistem tidak menemukan gambar [nama] karena ekstensi filenya salah ketik. Cek dulu apakah berkasnya JPG atau PNG sebelum menjalankan pembacaan."},{"kategori":"Computer Vision","tipe":"Menguji dari Satu Sudut","indikator":"Uji deteksi lancar dari depan, tapi mendadak tidak terbaca jika wajah benda dimiringkan sedikit.","jenis":"Perbaikan","template":"Akurasinya terlihat tinggi, tapi model [nama] sering gagal pada wajah yang miring. Tambahkan variasi sudut pandang di data ujimu."},{"kategori":"Computer Vision","tipe":"Gambar Berbintik Noise","indikator":"Gagal mengekstrak kontur gara-gara mengabaikan kotoran bercak piksel kecil pada lensa gambar.","jenis":"Perbaikan","template":"Bintik putih di gambar [nama] mengganggu kualitas fitur saat ekstraksi. Pakai filter penghalus seperti Gaussian supaya gambarnya lebih bersih."},{"kategori":"Computer Vision","tipe":"Mulai Paham Kanal Warna","indikator":"Akhirnya mengerti bahwa tiap warna terdiri dari 3 matriks yang ditumpuk, setelah mulanya bingung.","jenis":"Perkembangan","template":"Kemarin masih bingung soal warna, hari ini [nama] menguraikan tiga kanal gambar tanpa dibimbing. Pemahamanmu soal matriks gambar maju pesat."},{"kategori":"Computer Vision","tipe":"Warna Tidak Biru Lagi","indikator":"Tidak panik lagi saat foto memudar biru, otomatis menambah alur pembalik format ke RGB.","jenis":"Perkembangan","template":"[nama] kini jarang panik saat grafiknya berubah kebiruan karena ingat menukar urutan ke RGB. Kamu makin cepat mendiagnosis masalah tampilan."},{"kategori":"Computer Vision","tipe":"Threshold Adaptif","indikator":"Pindah dari teknik threshold statis kaku menjadi adaptive demi mengatasi bayangan.","jenis":"Perkembangan","template":"Setelah bergulat dengan masalah pencahayaan, [nama] kini mahir memakai binerisasi adaptif. Analisismu jadi lebih tangguh menghadapi gambar yang berbeda-beda."},{"kategori":"Computer Vision","tipe":"Bounding Box Makin Pas","indikator":"Kotak penanda objek yang kemarin salah letak kini sukses menempel tepat pinggiran benda.","jenis":"Perkembangan","template":"Sempat kesulitan menentukan koordinat, hari ini bingkai pelacakan [nama] mengunci objek dengan pas. Pemetaan batas luar bendanya rapi."},{"kategori":"Computer Vision","tipe":"Mengekstrak Bentuk Lengkung","indikator":"Sukses membingkai lengkung benda yang di pertemuan lalu gagal terdeteksi alur tepiannya.","jenis":"Perkembangan","template":"[nama] meninggalkan deteksi tepi sederhana dan kini bisa mengekstrak bentuk lengkung secara utuh. Pemahamanmu membaca wujud benda lewat struktur melompat maju."},{"kategori":"Computer Vision","tipe":"Mencoba Augmentasi Data","indikator":"Sadar melakukan manipulasi rotasi gambar agar variasi datasetnya menutupi kekurangan memori hafalan.","jenis":"Perkembangan","template":"[nama] berani mengacak rotasi dan kecerahan untuk menambah data latih, dan overfitting pun berkurang. Kesadaranmu soal keragaman data layak dihargai."},{"kategori":"Computer Vision","tipe":"Mengolah Frame Video","indikator":"Merambah pembedahan data statis ke data iteratif temporal lewat manipulasi bingkai klip video.","jenis":"Perkembangan","template":"[nama] tidak lagi terbatas pada gambar diam dan sudah mengolah video frame demi frame lewat perulangan. Kontrolmu atas alur algoritma makin matang."},{"kategori":"Computer Vision","tipe":"Blur Gaussian Merapikan Sudut","indikator":"Mengganti crop bergelombang jadi mulus lewat teknik pemisahan berbasis filter Gaussian Blur.","jenis":"Perkembangan","template":"Pekan lalu hasil potongannya masih kasar, hari ini filter Gaussian dari [nama] merapikan sudut benda. Pemahamanmu soal kernel konvolusi mulai terbukti."},{"kategori":"Computer Vision","tipe":"Berani Membedah Kegagalan","indikator":"Jujur menampilkan cuplikan modelnya di kondisi saat gagal mengenali profil dengan wajah terhalang.","jenis":"Perkembangan","template":"[nama] tidak menyembunyikan gambar yang salah dideteksi dan berani membedah penyebabnya. Sikap ilmiah dan analitis seperti ini patut dipuji."},{"kategori":"Computer Vision","tipe":"Parameter Menyesuaikan Sendiri","indikator":"Merekayasa pengunci parameter sehingga jangkauan warnanya fleksibel mencari bentuk secara mandiri.","jenis":"Perkembangan","template":"[nama] meninggalkan pengaturan nilai manual dan membuat fungsi pelacakan yang mengatur rentangnya sendiri. Lompatan menyusun fungsi deteksi yang menarik."}];
var KEY="fb-data-v2",data=SAMPLE,idx=0,jenis=null;
var $=function(i){return document.getElementById(i)};
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p)&&p.length)data=p}}catch(e){}

function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function fill(sel,items){var old=sel.value;sel.innerHTML="";items.forEach(function(v){var o=document.createElement("option");o.value=o.textContent=v;sel.appendChild(o)});if(items.indexOf(old)>-1)sel.value=old}
function pool(){return data.filter(function(d){return d.kategori===$("cat").value&&d.tipe===$("type").value&&(!jenis||d.jenis===jenis)})}

function build(){
  fill($("cat"),uniq(data.map(function(d){return d.kategori})));
  buildJenis();
}
function buildJenis(){
  var list=uniq(data.filter(function(d){return d.kategori===$("cat").value}).map(function(d){return d.jenis}));
  if(list.indexOf(jenis)<0)jenis=list[0]||null;
  var box=$("jenis");box.innerHTML="";
  list.forEach(function(j){var b=document.createElement("button");b.type="button";b.textContent=j;b.setAttribute("aria-pressed",j===jenis);b.onclick=function(){jenis=j;buildJenis()};box.appendChild(b)});
  buildTypes();
}
function buildTypes(){
  fill($("type"),uniq(data.filter(function(d){return d.kategori===$("cat").value&&d.jenis===jenis}).map(function(d){return d.tipe})));
  idx=0;render();
}
function render(){
  var hi=data.filter(function(d){return d.kategori===$("cat").value&&d.tipe===$("type").value&&d.jenis===jenis&&d.indikator})[0];$("hint").textContent=hi?hi.indikator:"";
  var p=pool(),out=$("out"),btn=$("copy");
  if(!p.length){out.className="empty";out.textContent="Belum ada template untuk pilihan ini.";btn.disabled=true;$("alt").hidden=true;return}
  var t=p[idx%p.length].template,n=$("name").value.trim();
  out.className="";out.textContent=t.split("[nama]").join(n||"[nama]");
  btn.disabled=false;
  $("alt").hidden=p.length<2;$("count").textContent="Variasi "+(idx%p.length+1)+" dari "+p.length;
}
function flash(m){var s=$("status");s.textContent=m;clearTimeout(flash.t);flash.t=setTimeout(function(){s.textContent=""},2000)}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt);
  return new Promise(function(res,rej){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy")?res():rej()}catch(e){rej(e)}a.remove()});
}

$("name").addEventListener("input",render);
$("cat").addEventListener("change",buildJenis);
$("type").addEventListener("change",function(){idx=0;render()});
$("next").onclick=function(){idx++;render()};
$("copy").onclick=function(){
  var b=$("copy");
  copyText($("out").textContent).then(function(){flash("Teks berhasil disalin!");b.classList.add("done");setTimeout(function(){b.classList.remove("done")},150)},function(){flash("Gagal menyalin. Tekan lama teks lalu salin manual.")});
};
$("json").value=JSON.stringify(data,null,1);
$("apply").onclick=function(){
  try{
    var p=JSON.parse($("json").value);
    if(!Array.isArray(p)||!p.length||!p.every(function(d){return d.kategori&&d.tipe&&d.jenis&&d.template}))throw new Error("Setiap item harus punya kategori, tipe, jenis, dan template.");
    data=p;try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}
    $("msg").textContent="Tersimpan: "+p.length+" template.";build();
  }catch(e){$("msg").textContent="Gagal: "+e.message}
};
$("reset").onclick=function(){data=SAMPLE;try{localStorage.removeItem(KEY)}catch(e){}$("json").value=JSON.stringify(data,null,1);$("msg").textContent="Kembali ke data bawaan.";build()};
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
build();
</script>
